<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-app v2</title>
    <link rel="stylesheet" href="./style.css">
     <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>
<body>
    <div class="todo-app">

  <h1>Todo App</h1>

  <div class="input-area">
    <input
      type="text"
      class="task-input"
      placeholder="Add a new task"
    >
    <button class="add-btn">Add Task</button>
  </div>

  <ul class="task-list">
    <!-- Tasks will appear here -->
  </ul>

  <p class="empty-state">
    No tasks yet
  </p>

  <div class="footer">

    <span class="task-count">
      0 tasks left
    </span>

    <div class="filters">
      <div class="filters__container">
      <button class="filters__btn all clicked filters-clicked">All</button>
      <button class="filters__btn active">Active</button>
      <button class="filters__btn completed">Completed</button>
      </div>
      <button class="filters__btn clear">Clear Completed</button>
    </div>

  </div>

</div>
<script defer src="./script.js"></script>
</body>
</html>
